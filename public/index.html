<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekom</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'palette': {
                            50: '#edf2fb',
                            100: '#e2eafc',
                            200: '#d7e3fc',
                            300: '#7da0fa',
                            400: '#00b4d8',
                            500: '#5a82de',
                            600: '#274690'    
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-palette-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-md border-b border-palette-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <h1 class="text-2xl font-bold text-palette-600">Ekom</h1>

                <!-- Barra de búsqueda -->
                <div class="flex-1 max-w-lg mx-8">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="Buscar productos..."
                               class="w-full pl-10 pr-4 py-2 border border-palette-300 rounded-lg focus:ring-2 focus:ring-palette-500 focus:border-transparent">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-search text-palette-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Controles derecho -->
                <div class="flex items-center space-x-4">
                    <!-- Botones login/register -->
                    <div id="auth-buttons" class="flex space-x-2">
                        <a href="login.html" class="px-4 py-2 text-palette-600 border border-palette-300 rounded-lg hover:bg-palette-100 transition-colors">Iniciar Sesión</a>
                        <a href="register.html" class="px-4 py-2 bg-palette-600 text-white rounded-lg hover:bg-palette-500 transition-colors">Registrarse</a>
                    </div>

                    <!-- Usuario logeado -->
                    <div id="user-menu" class="hidden flex items-center space-x-3">
                        <span id="user-name" class="text-gray-700 font-medium"></span>
                        <button id="logout-btn" class="px-3 py-1 text-sm text-palette-600 border border-palette-300 rounded hover:bg-palette-100 transition-colors">Cerrar Sesión</button>
                    </div>

                    <!-- Carrito -->
                    <button id="cart-btn" class="relative p-2 text-palette-600 hover:text-palette-500 transition-colors">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="flex max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 gap-6">

        <!-- Barra lateral -->
        <aside class="w-64 flex-shrink-0 hidden lg:block">
            <div class="bg-white rounded-lg shadow-sm border border-palette-200 p-6 space-y-6">
                <div>
                    <h3 class="text-lg font-semibold text-gray-900 mb-3">Acceso Rápido</h3>
                    <ul class="space-y-2">
                        <li><a href="#" data-filter="all" class="block px-3 py-2 text-gray-700 hover:bg-palette-100 rounded-md transition-colors">Todos los Productos</a></li>
                        <li><a href="#" data-filter="featured" class="block px-3 py-2 text-gray-700 hover:bg-palette-100 rounded-md transition-colors">Destacados</a></li>
                        <li><a href="#" data-filter="new" class="block px-3 py-2 text-gray-700 hover:bg-palette-100 rounded-md transition-colors">Nuevos Productos</a></li>
                        <li><a href="#" data-filter="sale" class="block px-3 py-2 text-gray-700 hover:bg-palette-100 rounded-md transition-colors">En Oferta</a></li>
                    </ul>
                </div>

                <div>
                    <h3 class="text-lg font-semibold text-gray-900 mb-3">Categorías</h3>
                    <ul id="categories-list" class="space-y-2"></ul>
                </div>

                <div>
                    <h3 class="text-lg font-semibold text-gray-900 mb-3">Ofertas Destacadas</h3>
                    <div id="featured-offers" class="space-y-3"></div>
                </div>
            </div>
        </aside>

        <!-- Feed principal -->
        <main class="flex-1">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">Feed de Productos</h2>
                <div class="flex items-center space-x-4">
                    <select id="sort-select" class="px-3 py-2 border border-palette-300 rounded-lg focus:ring-2 focus:ring-palette-500 focus:border-transparent">
                        <option value="newest">Más Recientes</option>
                        <option value="oldest">Más Antiguos</option>
                        <option value="price-low">Precio: Menor a Mayor</option>
                        <option value="price-high">Precio: Mayor a Menor</option>
                        <option value="rating">Mejor Calificados</option>
                    </select>
                </div>
            </div>

            <div id="posts-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8"></div>
            <div class="text-center">
                <button id="load-more-btn" class="px-6 py-3 bg-palette-600 text-white rounded-lg hover:bg-palette-500 transition-colors">Cargar Más</button>
            </div>
        </main>
    </div>

    <!-- Modal Nueva Publicación -->
    <div id="new-post-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md">
            <h3 class="text-xl font-semibold mb-4">Crear Nueva Publicación</h3>
            <form id="new-post-form" class="space-y-4">
                <input type="text" id="post-title" placeholder="Título" class="w-full border rounded-lg px-3 py-2">
                <textarea id="post-desc" placeholder="Descripción" rows="3" class="w-full border rounded-lg px-3 py-2"></textarea>
                <input type="number" id="post-price" placeholder="Precio" class="w-full border rounded-lg px-3 py-2">
                <button type="submit" class="w-full bg-palette-600 text-white py-2 rounded-lg hover:bg-palette-500">Publicar</button>
            </form>
            <button id="close-new-post" class="mt-3 text-gray-500 hover:text-gray-700">Cancelar</button>
        </div>
    </div>

    <!-- Carrito -->
    <div id="cart-slider" class="fixed top-0 right-0 h-full w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50">
        <div class="flex flex-col h-full">
            <div class="flex justify-between items-center p-6 border-b border-palette-200">
                <h3 class="text-xl font-semibold text-gray-900">Carrito de Compras</h3>
                <button id="close-cart" class="p-2 text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto p-6">
                <div id="cart-items" class="space-y-4"></div>
                <div id="cart-empty" class="hidden text-center py-12">
                    <i class="fas fa-shopping-cart text-4xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500">Tu carrito está vacío</p>
                </div>
            </div>
            <div class="border-t border-palette-200 p-6 space-y-4">
                <div class="flex justify-between items-center text-xl font-semibold">
                    <span>Total:</span>
                    <span>$<span id="cart-total">0.00</span></span>
                </div>
            </div>
        </div>
    </div>
    <div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>

    <!-- Scripts -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
