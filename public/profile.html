<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekom - Mi Perfil</title>
    <!-- Fuente Lexend global -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'palette': {
                            50: '#edf2fb',
                            100: '#e2eafc', 
                            200: '#d7e3fc',
                            300: '#ccdbfd',
                            400: '#c1d3fe',
                            500: '#b6ccfe',
                            600: '#abc4ff'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-palette-50 min-h-screen">

    <!-- Overlay de Carga -->
    <div id="loading-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-palette-600"></div>
    </div>

    <!-- Navbar -->
    <nav class="bg-white shadow-md border-b border-palette-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex-shrink-0">
                    <h1 class="text-2xl font-bold text-palette-600">Ekom</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-palette-100 transition-colors">Inicio</a>
                    <a href="profile.html" class="px-4 py-2 rounded-lg bg-palette-600 text-white hover:bg-palette-500 transition-colors">Mi Perfil</a>
                    <button id="logout-btn" class="px-4 py-2 bg-palette-600 text-white rounded-lg hover:bg-palette-500 transition-colors">Cerrar Sesión</button>
                    <button id="cart-btn" class="relative p-2 text-palette-600 hover:text-palette-500 transition-colors">
                        <i class="fas fa-shopping-cart text-xl"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenedor principal -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="bg-white rounded-xl shadow-md p-6">

            <!-- Header Perfil -->
            <div class="flex flex-col md:flex-row items-center md:items-start gap-6 mb-6">
                <img id="profile-avatar" src="img/default-avatar.png" alt="Avatar"
                     class="w-28 h-28 rounded-full object-cover border-4 border-palette-200 shadow-md">
                <div class="text-center md:text-left">
                    <h2 id="profile-name" class="text-2xl font-bold text-gray-900">Nombre Apellido</h2>
                    <p id="profile-bio" class="text-gray-600 mt-1">Sin biografía</p>
                </div>
            </div>

            <!-- Tabs -->
            <div>
                <div class="flex border-b mb-6">
                    <button class="tab-btn px-4 py-2 text-gray-600 hover:text-palette-600 border-b-2 border-transparent focus:outline-none"
                            data-tab="info">Información</button>
                    <button class="tab-btn px-4 py-2 text-gray-600 hover:text-palette-600 border-b-2 border-transparent focus:outline-none"
                            data-tab="posts">Mis Publicaciones</button>
                    <button class="tab-btn px-4 py-2 text-gray-600 hover:text-palette-600 border-b-2 border-transparent focus:outline-none"
                            data-tab="ratings">Mis Valoraciones</button>
                </div>

                <!-- Tab: Información -->
                <div id="tab-info" class="tab-content">
                    <h3 class="text-lg font-semibold mb-4">Editar Información</h3>
                    <form id="profile-form" class="space-y-4 max-w-md">
                        <div>
                            <label class="block font-medium mb-1">Nombre</label>
                            <input type="text" id="name" class="w-full border border-palette-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-palette-500">
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Apellido</label>
                            <input type="text" id="lastname" class="w-full border border-palette-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-palette-500">
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Biografía</label>
                            <textarea id="bio" rows="3" class="w-full border border-palette-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-palette-500"></textarea>
                        </div>
                        <div>
                            <label class="block font-medium mb-1">Avatar (URL)</label>
                            <input type="text" id="avatar" class="w-full border border-palette-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-palette-500">
                        </div>
                        <button type="submit" class="w-full bg-palette-600 text-white py-2 rounded-lg hover:bg-palette-500 transition-colors">Guardar cambios</button>
                    </form>
                </div>

                <!-- Tab: Mis Publicaciones -->
                <div id="tab-posts" class="tab-content hidden">
                    <h3 class="text-lg font-semibold mb-4">Mis Publicaciones</h3>
                    <div id="my-posts" class="grid md:grid-cols-2 gap-4">
                        <!-- Posts del usuario -->
                    </div>
                </div>

                <!-- Tab: Mis Valoraciones -->
                <div id="tab-ratings" class="tab-content hidden">
                    <h3 class="text-lg font-semibold mb-4">Mis Valoraciones</h3>
                    <div id="my-ratings" class="space-y-4">
                        <!-- Valoraciones del usuario -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Deslizador del Carrito -->
    <div id="cart-slider" class="fixed top-0 right-0 h-full w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 ease-in-out z-50">
        <div class="flex flex-col h-full">
            <!-- Header del Carrito -->
            <div class="flex justify-between items-center p-6 border-b border-palette-200">
                <h3 class="text-xl font-semibold text-gray-900">Carrito de Compras</h3>
                <button id="close-cart" class="p-2 text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Contenido del Carrito -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="cart-items" class="space-y-4">
                    <!-- Los elementos del carrito se cargarán dinámicamente -->
                </div>
                <div id="cart-empty" class="hidden text-center py-12">
                    <i class="fas fa-shopping-cart text-4xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500">Tu carrito está vacío</p>
                </div>
            </div>

            <!-- Footer del Carrito -->
            <div class="border-t border-palette-200 p-6 space-y-4">
                <div class="flex justify-between items-center text-xl font-semibold">
                    <span>Total:</span>
                    <span>$<span id="cart-total">0.00</span></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay del Carrito -->
    <div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>

    <script type="module" src="js/profile.js"></script>
</body>
</html>
