¿<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ekom</title>
    <!-- Fuentes Lexend e Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'palette': {
                            50: '#edf2fb',
                            100: '#e2eafc', 
                            200: '#d7e3fc',
                            300: '#ccdbfd',
                            400: '#c1d3fe',
                            500: '#b6ccfe',
                            600: '#abc4ff'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-palette-50 min-h-screen flex items-center justify-center">
    <!-- Card de Login -->
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-palette-600">Ekom</h1>
            <h2 class="text-xl font-semibold text-gray-900 mt-2">Iniciar Sesión</h2>
            <p class="text-gray-500 mt-1">Accede a tu cuenta para continuar</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div class="flex flex-col">
                <label for="email" class="mb-1 text-gray-700 font-medium">Correo Electrónico</label>
                <input type="email" id="email" name="email" required
                       class="px-4 py-2 border border-palette-300 rounded-lg focus:ring-2 focus:ring-palette-500 focus:border-transparent">
            </div>

            <div class="flex flex-col">
                <label for="password" class="mb-1 text-gray-700 font-medium">Contraseña</label>
                <input type="password" id="password" name="password" required
                       class="px-4 py-2 border border-palette-300 rounded-lg focus:ring-2 focus:ring-palette-500 focus:border-transparent">
            </div>

            <button type="submit" 
                    class="w-full flex justify-center items-center px-4 py-2 bg-palette-600 text-white rounded-lg hover:bg-palette-500 transition-colors">
                <span class="btn-text">Iniciar Sesión</span>
                <span class="btn-loading hidden ml-2">
                    <i class="fas fa-spinner fa-spin"></i>
                </span>
            </button>
        </form>

        <div class="text-center mt-6 space-y-2">
            <p class="text-gray-500">¿No tienes una cuenta? <a href="register.html" class="text-palette-600 hover:underline">Regístrate aquí</a></p>
            <p><a href="index.html" class="text-palette-600 hover:underline">Volver al inicio</a></p>
        </div>

        <div id="error-message" class="hidden text-red-500 text-center mt-4"></div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
